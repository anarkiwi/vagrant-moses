[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagrant-moses"
version = "0.9.1"
description = "Standalone C64 machine model: memory map, banked bus and ROMs, VIC-II and CIAs over a two-phase scheduler, a cycle-exact 6510 machine, KERNAL traps, IRQ dispatch, and native d64/d71/d81/t64 media extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
keywords = ["c64", "6510", "mos6510", "c64k", "irq", "interrupt", "sid", "retrocomputing", "d64", "d81", "t64"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.scripts]
vagrant-moses = "vagrant_moses.cli:main"

[project.optional-dependencies]
cli = ["tqdm>=4"]
# The cycle-exact Machine, flat_mpu and KernalHost step a jennings 6510.
cpu = ["jennings>=0.9.0"]
# vagrant_moses.sidorder judges envelopes with libresidfp.
sidorder = ["numpy>=1.23", "pylibresidfp>=0.5.0", "tqdm"]
dev = [
    "tqdm>=4",
    "jennings>=0.9.0",
    "numpy>=1.23",
    "pylibresidfp>=0.5.0",
    "black>=24",
    "pylint>=3",
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3",
]

[project.urls]
Homepage = "https://github.com/anarkiwi/vagrant-moses"
Source = "https://github.com/anarkiwi/vagrant-moses"
Issues = "https://github.com/anarkiwi/vagrant-moses/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -n auto -m 'not roms'"
markers = ["roms: real C64 ROM download + checksum (needs network)"]

[tool.coverage.run]
branch = true
source = ["vagrant_moses"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pylint.main]
disable = "all"
enable = [
    "redefined-builtin",
    "unused-import",
    "unused-argument",
    "cell-var-from-loop",
    "unused-variable",
    "unbalanced-tuple-unpacking",
    "stop-iteration-return",
    "reimported",
    "dangerous-default-value",
    "pointless-statement",
    "using-constant-test",
    "raise-missing-from",
]

# Wheels carry the native machine: `maturin build --release` (CI) or `maturin develop`.
# The sdist builds with setuptools above and installs the pure-Python machine only.
[tool.maturin]
manifest-path = "crates/moses-py/Cargo.toml"
module-name = "vagrant_moses._core"
python-source = "src"
python-packages = ["vagrant_moses"]
features = ["pyo3/extension-module"]
