[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagrant-moses"
version = "0.2.0"
description = "Standalone C64 machine model: VIC-II and CIA volatile I/O over a two-phase event scheduler, power-on RAM, interrupt-vector discovery, and the ROM-free IRQ dispatch path"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
keywords = ["c64", "6510", "mos6510", "c64k", "irq", "interrupt", "sid", "retrocomputing"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Emulators",
]
# No runtime dependencies: pure Python over a writable 64 KiB memory buffer.
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24",
    "pylint>=3",
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3",
]

[project.urls]
Homepage = "https://github.com/anarkiwi/vagrant-moses"
Source = "https://github.com/anarkiwi/vagrant-moses"
Issues = "https://github.com/anarkiwi/vagrant-moses/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -n auto"

[tool.coverage.run]
branch = true
source = ["vagrant_moses"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pylint.main]
disable = "all"
enable = [
    "redefined-builtin",
    "unused-import",
    "unused-argument",
    "cell-var-from-loop",
    "unused-variable",
    "unbalanced-tuple-unpacking",
    "stop-iteration-return",
    "reimported",
    "dangerous-default-value",
    "pointless-statement",
    "using-constant-test",
    "raise-missing-from",
]
