[package]
name = "moses-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
moses-core = { path = "../moses-core" }
jennings-core = { git = "https://github.com/anarkiwi/jennings", tag = "v0.5.1" }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
