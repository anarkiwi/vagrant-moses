[package]
name = "moses-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
moses-core = { path = "../moses-core" }
jennings-core = { git = "https://github.com/anarkiwi/jennings", rev = "37ad0f440799ed94a9b7fbdcd5e01a150c66636e" }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
