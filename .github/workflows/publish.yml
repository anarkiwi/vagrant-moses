name: Publish

# Publishes to PyPI via trusted publishing (OIDC). The maintainer must register
# the trusted publisher on PyPI: project vagrant-moses, owner anarkiwi,
# repo anarkiwi/vagrant-moses, workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # abi3-py312: one cp312-abi3 wheel per platform serves 3.12+.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - name: Smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/smoke/bin/python -c "import vagrant_moses.machine as m; assert m.NATIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + pure wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag push and its GitHub release both fire this workflow; skip-existing
          # makes the second a no-op instead of a "File already exists" failure.
          skip-existing: true
