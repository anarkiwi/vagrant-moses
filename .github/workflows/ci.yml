name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install VICE c1541 (media cross-check)
        run: sudo apt-get update && sudo apt-get install -y vice
      - name: Install package + dev deps + native core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          tools/build_native.sh
      - name: black --check
        run: black --check src tests scripts tools
      - name: pylint
        run: pylint src tests scripts tools
      - name: pytest + coverage (> 85%)
        run: pytest --cov=vagrant_moses --cov-report=term-missing --cov-fail-under=85
      - name: Differential run, Python vs native machine
        run: python tools/diff_machines.py --programs 100 --cycles 1000000

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p moses-core

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + pure wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the pure wheel
        run: |
          pip install dist/*.whl
          python -c "import vagrant_moses; print(vagrant_moses.__version__)"
      - name: Build and smoke test the native wheel
        run: |
          pip install maturin
          maturin build --release --locked --out native
          pip install --force-reinstall native/*.whl
          cd "$RUNNER_TEMP"
          python -c "import vagrant_moses.machine as m; assert m.NATIVE"
