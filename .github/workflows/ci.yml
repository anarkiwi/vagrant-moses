name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install VICE c1541 (media cross-check), MLIR 22 and clang-format (cgen)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update && sudo apt-get install -y vice mlir-22-tools clang-format
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Install package + dev deps + native core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          tools/build_native.sh
      - name: black --check
        run: black --check src tests scripts tools
      - name: pylint
        run: pylint src tests scripts tools
      - name: Cache SingleStepTests 6502 cases
        uses: actions/cache@v6
        with:
          path: .harte-cache
          key: harte-2f6980a2d957-v2
      - name: Bus cycles against SingleStepTests 6502
        run: python tools/harte_cycles.py --cases 100
      - name: pytest + coverage (> 85%)
        run: pytest --cov=vagrant_moses --cov-report=term-missing --cov-fail-under=85
      - name: Differential run, Python vs native machine
        run: python tools/diff_machines.py --programs 100 --cycles 1000000

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p moses-core

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + pure wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the pure wheel
        run: |
          pip install dist/*.whl
          python -c "import vagrant_moses; print(vagrant_moses.__version__)"
      - name: Build and smoke test the native wheel
        run: |
          pip install maturin
          maturin build --release --locked --out native
          pip install --force-reinstall native/*.whl
          cd "$RUNNER_TEMP"
          python -c "import vagrant_moses.machine as m; assert m.NATIVE"
